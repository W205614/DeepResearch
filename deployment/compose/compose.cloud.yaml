# Standalone application tier. Do not combine with compose.yaml.
# --project-directory . keeps build paths relative to the repository root.
name: deepresearch-cloud
x-public-url: ${APP_PUBLIC_URL:?Set HTTPS APP_PUBLIC_URL}
x-certificates: &certificates
  type: bind
  source: ${CLOUD_CERTIFICATES_DIR:?Set CLOUD_CERTIFICATES_DIR with postgres-ca.pem}
  target: /run/certs
  read_only: true
  bind: {create_host_path: false}
x-defaults: &defaults
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  stop_grace_period: 45s
  tmpfs: [/tmp:size=256m, "/data:size=32m,uid=10001,gid=10001"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-python-environment: &python-environment
  AUTH_MODE: oidc
  DEMO_MODE: "false"
  QUEUE_BACKEND: redis
  DOCUMENT_SCAN_MODE: clamav
  CHECKPOINT_SCHEMA_MANAGED: "true"
  DATA_DIR: /data
  INTERNAL_SERVICE_TOKEN_FILE: /run/internal/internal_service_token
  DATABASE_URL: ${PYTHON_DATABASE_URL:?Set PYTHON_DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  REDIS_SSL_CA_CERTS: ${REDIS_SSL_CA_CERTS:-}
  MILVUS_URI: ${MILVUS_URI:?Set MILVUS_URI}
  MILVUS_TOKEN: ${MILVUS_TOKEN:?Set MILVUS_TOKEN}
  MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
  MILVUS_SERVER_PEM_PATH: ${MILVUS_SERVER_PEM_PATH:-}
  VECTOR_COLLECTION_PREFIX: ${VECTOR_COLLECTION_PREFIX:-dr}
  CLAMAV_HOST: ${CLAMAV_HOST:?Set private CLAMAV_HOST}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-deepresearch-api}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
  OIDC_CA_CERTS: ${OIDC_CA_CERTS:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-deepresearch-web}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_REGISTRATION_ENABLED: ${OIDC_REGISTRATION_ENABLED:-false}
  OBJECT_STORE_BACKEND: s3
  OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?Set OBJECT_STORE_BUCKET}
  OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?Set OBJECT_STORE_REGION}
  OBJECT_STORE_ADDRESSING_STYLE: ${OBJECT_STORE_ADDRESSING_STYLE:-auto}
  OBJECT_STORE_AUTO_CREATE_BUCKET: "false"
  OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-}
  OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-}
  OBJECT_STORE_SESSION_TOKEN: ${OBJECT_STORE_SESSION_TOKEN:-}
  OBJECT_STORE_SSE: ${OBJECT_STORE_SSE:-}
  OBJECT_STORE_KMS_KEY_ID: ${OBJECT_STORE_KMS_KEY_ID:-}
  # Standard AWS workload-identity files/credential endpoints are supplied by the host orchestrator.
  AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
  AWS_CA_BUNDLE: ${AWS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
  AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
  AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
  AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
  AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE: ${AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE:-}
  LLM_MODEL_ID: ${LLM_MODEL_ID:?Set LLM_MODEL_ID}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
  VISION_MODEL_ID: ${VISION_MODEL_ID:-gpt-6.1-sol}
  LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
  LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{}}'
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?Set EMBEDDING_BASE_URL}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?Set EMBEDDING_DIMENSION}
  SEND_EMBEDDING_DIMENSIONS: ${SEND_EMBEDDING_DIMENSIONS:-true}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-openai}
  BOCHA_BASE_URL: ${BOCHA_BASE_URL:-https://api.bochaai.com/v1}
  BOCHA_API_KEY: ${BOCHA_API_KEY:-}
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_URL: ${RERANKER_URL:-https://api.siliconflow.cn/v1/rerank}
  RERANKER_API_KEY: ${RERANKER_API_KEY:-}
  RERANKER_MODEL: ${RERANKER_MODEL:-Pro/BAAI/bge-reranker-v2-m3}
  ALLOW_INTERNAL_MODEL_PROCESSING: ${ALLOW_INTERNAL_MODEL_PROCESSING:-false}
  PLATFORM_OPERATOR_SUBJECTS: ${PLATFORM_OPERATOR_SUBJECTS:-}
  MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-600}
  MAX_RUN_TOTAL_SECONDS: ${MAX_RUN_TOTAL_SECONDS:-1200}
  MAX_RUN_CALL_ATTEMPTS: ${MAX_RUN_CALL_ATTEMPTS:-80}
  MAX_RUN_RESERVED_TOKENS: ${MAX_RUN_RESERVED_TOKENS:-2000000}
  MAX_QUEUED_RUNS: ${MAX_QUEUED_RUNS:-20}
  MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
  PLATFORM_ACTIVE_RUN_LIMIT: ${PLATFORM_ACTIVE_RUN_LIMIT:-5}
  RESEARCH_WORKER_MAX_JOBS: ${RESEARCH_WORKER_MAX_JOBS:-3}
  WORKER_DRAIN_SECONDS: ${WORKER_DRAIN_SECONDS:-30}
  MAX_LLM_CONCURRENCY: ${MAX_LLM_CONCURRENCY:-3}
  WORKSPACE_CONCURRENT_RUN_LIMIT: ${WORKSPACE_CONCURRENT_RUN_LIMIT:-2}
  PLATFORM_PERIOD_CALLS: ${PLATFORM_PERIOD_CALLS:-1000}
  PLATFORM_PERIOD_TOKENS: ${PLATFORM_PERIOD_TOKENS:-20000000}
  SUBJECT_PERIOD_CALLS: ${SUBJECT_PERIOD_CALLS:-200}
  SUBJECT_PERIOD_TOKENS: ${SUBJECT_PERIOD_TOKENS:-4000000}
  WORKSPACE_PERIOD_CALLS: ${WORKSPACE_PERIOD_CALLS:-400}
  WORKSPACE_PERIOD_TOKENS: ${WORKSPACE_PERIOD_TOKENS:-8000000}
  ACCOUNT_PERIOD_CALLS: ${ACCOUNT_PERIOD_CALLS:-1000}
  ACCOUNT_PERIOD_TOKENS: ${ACCOUNT_PERIOD_TOKENS:-20000000}
  TASK_LOG_LEVEL: ${TASK_LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_CERTIFICATE: ${OTEL_EXPORTER_OTLP_CERTIFICATE:-}
services:
  web:
    build: {context: ./frontend}
    environment:
      OIDC_CONNECT_ORIGINS: ${OIDC_CONNECT_ORIGINS:?Set exact identity origins for CSP}
    deploy: {replicas: 2}
    depends_on: {backend: {condition: service_healthy}}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    <<: *defaults
    deploy: {replicas: 2}
    build: {context: ./business-backend}
    mem_limit: 1g
    cpus: 1
    tmpfs: [/tmp:size=128m]
    environment:
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      REDIS_SSL_CA_CERTS: ${REDIS_SSL_CA_CERTS:-}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-deepresearch}
      PLATFORM_ACTIVE_RUN_LIMIT: ${PLATFORM_ACTIVE_RUN_LIMIT:-5}
      SPRING_DATASOURCE_URL: ${JAVA_DATABASE_URL:?Set JDBC JAVA_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: dr_java
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
      SPRING_DATASOURCE_PASSWORD: ${JAVA_DB_PASSWORD:?Set JAVA_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-deepresearch-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-deepresearch-web}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_REGISTRATION_ENABLED: ${OIDC_REGISTRATION_ENABLED:-false}
      INTERNAL_SERVICE_TOKEN_FILE: /run/internal/internal_service_token
      AGENT_BASE_URL: http://agent-gateway:8081
      PLATFORM_OPERATOR_SUBJECTS: ${PLATFORM_OPERATOR_SUBJECTS:-}
      ALLOW_INTERNAL_MODEL_PROCESSING: ${ALLOW_INTERNAL_MODEL_PROCESSING:-false}
      MAX_QUEUED_RUNS: ${MAX_QUEUED_RUNS:-20}
      WORKSPACE_CONCURRENT_RUN_LIMIT: ${WORKSPACE_CONCURRENT_RUN_LIMIT:-2}
      MAX_RUN_TOTAL_SECONDS: ${MAX_RUN_TOTAL_SECONDS:-1200}
      MAX_RUN_CALL_ATTEMPTS: ${MAX_RUN_CALL_ATTEMPTS:-80}
      MAX_RUN_RESERVED_TOKENS: ${MAX_RUN_RESERVED_TOKENS:-2000000}
    volumes: [internal-service-token:/run/internal:ro, *certificates]
    depends_on: {agent-gateway: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/readyz']
      interval: 10s
      timeout: 5s
      retries: 10
  agent:
    <<: *defaults
    deploy: {replicas: 2}
    build: .
    environment: *python-environment
    volumes: [internal-service-token:/run/internal:ro, *certificates]
    depends_on:
      migrate: {condition: service_completed_successfully}
      token-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker: &worker
    <<: *defaults
    deploy: {replicas: 2}
    build: .
    command: python -m backend.worker research
    environment: *python-environment
    volumes: [internal-service-token:/run/internal:ro, *certificates]
    depends_on: {agent: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, backend.core.worker_health, --ready]
      interval: 15s
      timeout: 5s
      retries: 3
  document-worker:
    <<: *worker
    command: python -m backend.worker documents
    mem_limit: 1g
    cpus: 1
  agent-gateway:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    volumes: ['./deployment/nginx/agent-gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: {agent: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/readyz'], interval: 10s, timeout: 5s, retries: 10}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  edge:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports: ['127.0.0.1:${APP_PORT:-8080}:8080']
    volumes: ['./deployment/nginx/replica-edge.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: {web: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz'], interval: 10s, timeout: 5s, retries: 10}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  migrate:
    <<: *defaults
    build: .
    command: python scripts/migrate_services.py
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Set psycopg MIGRATOR_DATABASE_URL}
    volumes: [*certificates]
    restart: "no"
  token-init:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: [/bin/sh, -ec, 'umask 077; test -s /internal/internal_service_token || head -c 32 /dev/urandom | base64 > /internal/internal_service_token; chmod 0444 /internal/internal_service_token']
    volumes: [internal-service-token:/internal]
    network_mode: none
    restart: "no"
volumes:
  internal-service-token:
