services:
  api:
    environment:
      INTERNAL_SERVICE_TOKEN: performance-internal-token
      TASK_LOG_LEVEL: INFO
  worker:
    environment:
      INTERNAL_SERVICE_TOKEN: performance-internal-token
  document-worker:
    environment:
      INTERNAL_SERVICE_TOKEN: performance-internal-token
  keycloak-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: performance-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: performance-only
      KC_BOOTSTRAP_ADMIN_USERNAME: perf-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: performance-only
    volumes:
      - ./keycloak/deepresearch-perf-realm.json:/opt/keycloak/data/import/deepresearch-perf-realm.json:ro
    depends_on:
      keycloak-postgres: {condition: service_healthy}
  fault-proxy:
    image: deepresearch-verify
    command: uvicorn scripts.performance_proxy:create_app --factory --host 0.0.0.0 --port 8010 --no-access-log
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8010/readyz',timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./business-backend
    mem_limit: 1g
    cpus: 1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deepresearch
      SPRING_DATASOURCE_USERNAME: deepresearch
      SPRING_DATASOURCE_PASSWORD: verification-only
      AUTH_MODE: oidc
      OIDC_ISSUER: http://keycloak:8080/realms/deepresearch-perf
      OIDC_AUDIENCE: deepresearch-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/deepresearch-perf/protocol/openid-connect/certs
      AGENT_BASE_URL: http://fault-proxy:8010
      INTERNAL_SERVICE_TOKEN: performance-internal-token
      AGENT_PROXY_MAX_CONCURRENT: '8'
      AGENT_PROXY_ACQUIRE_TIMEOUT_MILLIS: '25'
      AGENT_PROXY_TIMEOUT_SECONDS: '5'
      AGENT_PROXY_CIRCUIT_FAILURE_THRESHOLD: '5'
      AGENT_PROXY_CIRCUIT_OPEN_SECONDS: '3'
      API_RATE_LIMIT_PER_SECOND: '20'
      API_RATE_LIMIT_BURST: '40'
      API_GLOBAL_RATE_LIMIT_PER_SECOND: '250'
      API_GLOBAL_RATE_LIMIT_BURST: '250'
      API_MAX_CONCURRENT: '32'
      API_CONCURRENCY_ACQUIRE_TIMEOUT_MILLIS: '10'
      SERVER_MAX_THREADS: '64'
    depends_on:
      migrate: {condition: service_completed_successfully}
      fault-proxy: {condition: service_healthy}
      keycloak: {condition: service_started}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 3s
      timeout: 3s
      retries: 20
  performance:
    image: deepresearch-verify
    user: '0'
    command: python scripts/load_system_performance.py
    environment:
      PERFORMANCE_BACKEND_URL: http://edge
      PERFORMANCE_METRICS_URL: http://backend:8080
      PERFORMANCE_KEYCLOAK_URL: http://keycloak:8080
    volumes:
      - ./scripts:/app/scripts:ro
      - performance-data:/load
    depends_on:
      edge: {condition: service_healthy}
      worker: {condition: service_healthy}
      document-worker: {condition: service_healthy}
    profiles: [performance]
  performance-k6:
    image: grafana/k6:0.54.0
    user: '0'
    command: run /scripts/load-system-k6.js
    environment:
      PERFORMANCE_URL: http://edge
    volumes:
      - ./scripts:/scripts:ro
      - performance-data:/load
    depends_on:
      edge: {condition: service_healthy}
    profiles: [performance]

volumes:
  performance-data:
