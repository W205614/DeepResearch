name: deepresearch
services:
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    build: .
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    environment: &runtime-environment
      LLM_MODEL_ID: ${LLM_MODEL_ID:-deepseek-v4-flash}
      VISION_MODEL_ID: ${VISION_MODEL_ID:-deepseek-v4-flash-vision-exp}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-}'
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai-proxy.org/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      SEND_EMBEDDING_DIMENSIONS: ${SEND_EMBEDDING_DIMENSIONS:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-deepseek}
      BOCHA_BASE_URL: ${BOCHA_BASE_URL:-https://api.bochaai.com/v1}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8180/realms/deepresearch}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-deepresearch-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/deepresearch/protocol/openid-connect/certs}
      SOURCE_TRUST_OVERRIDES: '${SOURCE_TRUST_OVERRIDES:-{}}'
      WEB_CACHE_TTL_HOURS: ${WEB_CACHE_TTL_HOURS:-168}
      AUTO_SAVE_SEMANTIC_MEMORY: ${AUTO_SAVE_SEMANTIC_MEMORY:-false}
      DEMO_MODE: "false"
      MAX_REFLECTION_ROUNDS: ${MAX_REFLECTION_ROUNDS:-2}
      MAX_SEARCH_CALLS: ${MAX_SEARCH_CALLS:-12}
      WEB_RESULTS_PER_QUERY: ${WEB_RESULTS_PER_QUERY:-8}
      MAX_WEB_CANDIDATES: ${MAX_WEB_CANDIDATES:-24}
      WEB_SEARCH_CONCURRENCY: ${WEB_SEARCH_CONCURRENCY:-3}
      WEB_FETCH_CONCURRENCY: ${WEB_FETCH_CONCURRENCY:-6}
      ALLOW_INTERNAL_MODEL_PROCESSING: ${ALLOW_INTERNAL_MODEL_PROCESSING:-false}
      MAX_JOB_RETRIES: ${MAX_JOB_RETRIES:-2}
      MAX_QUEUED_RUNS: ${MAX_QUEUED_RUNS:-20}
      RAG_MAX_CORPUS_CHUNKS: ${RAG_MAX_CORPUS_CHUNKS:-4000}
      RAG_CORPUS_CACHE_USERS: ${RAG_CORPUS_CACHE_USERS:-4}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-128000}
      VISION_CONTEXT_TOKENS: ${VISION_CONTEXT_TOKENS:-128000}
      VISION_IMAGE_TOKEN_RESERVE: ${VISION_IMAGE_TOKEN_RESERVE:-16000}
      MAX_RUN_TOTAL_SECONDS: ${MAX_RUN_TOTAL_SECONDS:-1200}
      MAX_RUN_CALL_ATTEMPTS: ${MAX_RUN_CALL_ATTEMPTS:-80}
      MAX_RUN_RESERVED_TOKENS: ${MAX_RUN_RESERVED_TOKENS:-2000000}
      RAG_VECTOR_TIMEOUT_SECONDS: ${RAG_VECTOR_TIMEOUT_SECONDS:-3}
      MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-600}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      MAX_LLM_CONCURRENCY: ${MAX_LLM_CONCURRENCY:-3}
      TASK_LOG_LEVEL: ${TASK_LOG_LEVEL:-INFO}
      SEMANTIC_MEMORY_MIN_SCORE: ${SEMANTIC_MEMORY_MIN_SCORE:-0.35}
      CONVERSATION_RECENT_RUNS: ${CONVERSATION_RECENT_RUNS:-6}
      CONVERSATION_TURN_LIMIT: ${CONVERSATION_TURN_LIMIT:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-90}
      MILVUS_URI: http://milvus:19530
      DATA_DIR: /data
      DATABASE_URL: "postgresql://deepresearch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/deepresearch"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      DOCUMENT_SCAN_MODE: clamav
      OBJECT_STORE_BACKEND: s3
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: deepresearch-documents
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-deepresearch}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      ALERT_RELAY_TOKEN_FILE: /run/secrets/alert_relay_token
    volumes:
      - alert-relay-token:/run/secrets:ro
    depends_on:
      milvus:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      clamav:
        condition: service_started
      otel-collector:
        condition: service_started
      alert-token-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepresearch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: minio server /minio_data --console-address :9001
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-deepresearch}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports: ["127.0.0.1:8180:8080"]
    # Keep local user accounts and realm changes across normal rebuilds.
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped
  worker: &research-worker
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    build: .
    command: arq backend.worker.WorkerSettings
    expose: ["8001"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment: *runtime-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_started }
      clamav: { condition: service_started }
      otel-collector: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  document-worker:
    <<: *research-worker
    command: arq backend.worker.DocumentWorkerSettings
    mem_limit: 1g
    cpus: 1
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: "postgresql+asyncpg://deepresearch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/deepresearch"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: deepresearch
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes: [keycloak-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.4.2_base
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alert-relay-token:/run/secrets:ro
    depends_on:
      alert-token-init:
        condition: service_completed_successfully
    restart: unless-stopped
  alert-token-init:
    image: alpine:3.20
    command: ["/bin/sh", "-c", "umask 077; test -s /token/alert_relay_token || head -c 32 /dev/urandom | base64 > /token/alert_relay_token; chmod 0444 /token/alert_relay_token"]
    volumes:
      - alert-relay-token:/token
    restart: "no"
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
volumes:
  etcd-data:
  minio-data:
  milvus-data:
  keycloak-data:
  postgres-data:
  keycloak-postgres-data:
  redis-data:
  grafana-data:
  tempo-data:
  loki-data:
  alert-relay-token:
