services:
  backend:
    environment:
      DATABASE_URL: "postgresql://deepresearch:${POSTGRES_PASSWORD:-deepresearch-demo-only}@postgres:5432/deepresearch"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8180/realms/deepresearch
      OIDC_JWKS_URL: http://keycloak:8080/realms/deepresearch/protocol/openid-connect/certs
      OIDC_AUDIENCE: deepresearch-api
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DOCUMENT_SCAN_MODE: clamav
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
      clamav: { condition: service_started }
      otel-collector: { condition: service_started }
      migrate: { condition: service_completed_successfully }
  worker:
    build: .
    command: arq backend.worker.WorkerSettings
    expose: ["8001"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      LLM_MODEL_ID: ${LLM_MODEL_ID:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-}'
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai-proxy.org/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      SEND_EMBEDDING_DIMENSIONS: ${SEND_EMBEDDING_DIMENSIONS:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-deepseek}
      BOCHA_BASE_URL: ${BOCHA_BASE_URL:-https://api.bochaai.com/v1}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      SOURCE_TRUST_OVERRIDES: '${SOURCE_TRUST_OVERRIDES:-{}}'
      WEB_CACHE_TTL_HOURS: ${WEB_CACHE_TTL_HOURS:-168}
      AUTO_SAVE_SEMANTIC_MEMORY: ${AUTO_SAVE_SEMANTIC_MEMORY:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      MAX_REFLECTION_ROUNDS: ${MAX_REFLECTION_ROUNDS:-2}
      MAX_SEARCH_CALLS: ${MAX_SEARCH_CALLS:-12}
      WEB_RESULTS_PER_QUERY: ${WEB_RESULTS_PER_QUERY:-8}
      MAX_WEB_CANDIDATES: ${MAX_WEB_CANDIDATES:-24}
      MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-600}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      MAX_LLM_CONCURRENCY: ${MAX_LLM_CONCURRENCY:-3}
      TASK_LOG_LEVEL: ${TASK_LOG_LEVEL:-INFO}
      SEMANTIC_MEMORY_MIN_SCORE: ${SEMANTIC_MEMORY_MIN_SCORE:-0.35}
      CONVERSATION_RECENT_RUNS: ${CONVERSATION_RECENT_RUNS:-6}
      CONVERSATION_TURN_LIMIT: ${CONVERSATION_TURN_LIMIT:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-90}
      DATABASE_URL: "postgresql://deepresearch:${POSTGRES_PASSWORD:-deepresearch-demo-only}@postgres:5432/deepresearch"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      MILVUS_URI: http://milvus:19530
      DATA_DIR: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DOCUMENT_SCAN_MODE: clamav
    volumes: [research-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
      clamav: { condition: service_started }
      otel-collector: { condition: service_started }
      migrate: { condition: service_completed_successfully }
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: "postgresql+asyncpg://deepresearch:${POSTGRES_PASSWORD:-deepresearch-demo-only}@postgres:5432/deepresearch"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: deepresearch
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepresearch-demo-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:1.4.2_base
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-before-sharing}
    ports: ["127.0.0.1:8180:8080"]
    # Keep local users and realm changes across rebuilds. The checked-in realm
    # remains read-only and is used only to bootstrap an empty Keycloak volume.
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-before-sharing}"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
volumes:
  postgres-data:
  redis-data:
  grafana-data:
  keycloak-data:
