server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${SERVER_MAX_THREADS:64}
      min-spare: ${SERVER_MIN_SPARE_THREADS:8}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:512}
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}

spring:
  application:
    name: deepresearch-business
  jackson:
    property-naming-strategy: SNAKE_CASE
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deepresearch}
    username: ${SPRING_DATASOURCE_USERNAME:deepresearch}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 3000
  servlet:
    multipart:
      # Java forwards the raw multipart stream to Python; parsing here consumes it.
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/deepresearch}
          jwk-set-uri: ${OIDC_JWKS_URL:http://localhost:8180/realms/deepresearch/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:deepresearch-api}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: never

deepresearch:
  auth-mode: ${AUTH_MODE:oidc}
  oidc-issuer: ${OIDC_ISSUER:http://localhost:8180/realms/deepresearch}
  agent-base-url: ${AGENT_BASE_URL:http://localhost:8000}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  internal-token-file: ${INTERNAL_SERVICE_TOKEN_FILE:}
  allow-internal-model-processing: ${ALLOW_INTERNAL_MODEL_PROCESSING:false}
  workspace-concurrent-run-limit: ${WORKSPACE_CONCURRENT_RUN_LIMIT:2}
  max-queued-runs: ${MAX_QUEUED_RUNS:20}
  max-run-total-seconds: ${MAX_RUN_TOTAL_SECONDS:1200}
  max-run-call-attempts: ${MAX_RUN_CALL_ATTEMPTS:80}
  max-run-reserved-tokens: ${MAX_RUN_RESERVED_TOKENS:2000000}
  outbox-batch-size: ${OUTBOX_BATCH_SIZE:20}
  outbox-lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
  outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  outbox-base-delay-seconds: ${OUTBOX_BASE_DELAY_SECONDS:2}
  outbox-max-delay-seconds: ${OUTBOX_MAX_DELAY_SECONDS:60}
  agent-proxy-max-concurrent: ${AGENT_PROXY_MAX_CONCURRENT:8}
  agent-proxy-acquire-timeout-millis: ${AGENT_PROXY_ACQUIRE_TIMEOUT_MILLIS:25}
  agent-proxy-timeout-seconds: ${AGENT_PROXY_TIMEOUT_SECONDS:30}
  agent-proxy-circuit-failure-threshold: ${AGENT_PROXY_CIRCUIT_FAILURE_THRESHOLD:5}
  agent-proxy-circuit-open-seconds: ${AGENT_PROXY_CIRCUIT_OPEN_SECONDS:15}
  api-rate-limit-per-second: ${API_RATE_LIMIT_PER_SECOND:20}
  api-rate-limit-burst: ${API_RATE_LIMIT_BURST:40}
  api-rate-limit-max-principals: ${API_RATE_LIMIT_MAX_PRINCIPALS:10000}
  api-global-rate-limit-per-second: ${API_GLOBAL_RATE_LIMIT_PER_SECOND:250}
  api-global-rate-limit-burst: ${API_GLOBAL_RATE_LIMIT_BURST:250}
  api-max-concurrent: ${API_MAX_CONCURRENT:32}
  api-concurrency-acquire-timeout-millis: ${API_CONCURRENCY_ACQUIRE_TIMEOUT_MILLIS:10}
  outbox-dispatch-delay-ms: ${OUTBOX_DISPATCH_DELAY_MS:500}
  outbox-dispatch-initial-delay-ms: ${OUTBOX_DISPATCH_INITIAL_DELAY_MS:500}
