limit_req_zone $binary_remote_addr zone=api_edge:10m rate=250r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;
split_clients $request_id $overload_log_sample { 1% 1; * 0; }
map "$status:$overload_log_sample" $access_loggable { "429:0" 0; default 1; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log combined if=$access_loggable;
  client_max_body_size 11m;
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_upstream http://backend:8080;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8180; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    # Coarse pre-auth overload guard. Authenticated per-workspace limits remain in Java.
    limit_req zone=api_edge burst=250 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    limit_conn api_connections 64;
    limit_conn_status 429;
    limit_conn_log_level notice;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 650s;
  }
  location = /healthz { proxy_pass $backend_upstream/healthz; }
  location = /livez { proxy_pass $backend_upstream/livez; }
  location = /readyz { proxy_pass $backend_upstream/readyz; }
  location / { try_files $uri $uri/ /index.html; }
}
