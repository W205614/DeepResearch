apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deepresearch-metrics-discovery, namespace: deepresearch}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: deepresearch-metrics-discovery, namespace: deepresearch}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deepresearch-metrics-discovery
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deepresearch-private-metrics, namespace: deepresearch}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, agent, worker, document-worker]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {deepresearch-monitoring: "true"}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8001}
