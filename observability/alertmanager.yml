global:
  resolve_timeout: 5m
route:
  receiver: deepresearch-internal
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: deepresearch-internal
    webhook_configs:
      - url: http://backend:8000/internal/alerts
        send_resolved: true