# Private Compose/VPC example. Enumerate replicas; do not scrape through a load balancer.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts.production-cloud.yml
alerting:
  alertmanagers:
    - scheme: https
      static_configs: [{targets: ["REPLACE_PRIVATE_ALERTMANAGER:9093"]}]
      tls_config:
        ca_file: /run/certs/monitoring-ca.pem
      authorization:
        credentials_file: /run/secrets/alertmanager-token
scrape_configs:
  - job_name: deepresearch-private-replicas
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets.production.json"]
        refresh_interval: 30s
    sample_limit: 20000
  - job_name: deepresearch-cloud-backup
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["REPLACE_PRIVATE_BACKUP_EXPORTER:9100"]
        labels: {deployment: deepresearch-production}
    tls_config:
      ca_file: /run/certs/monitoring-ca.pem
    authorization:
      credentials_file: /run/secrets/backup-exporter-token
    sample_limit: 1000
