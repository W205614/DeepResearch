name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check backend tests scripts main.py
      - run: uv run pytest -q
      - run: uv run python scripts/evaluate.py --verify
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.yaml -f compose.demo.yaml up -d --build --wait --wait-timeout 300
      - run: curl --fail --retry 15 --retry-connrefused http://127.0.0.1:8080/livez
      - if: always()
        run: docker compose -f compose.yaml -f compose.demo.yaml logs --no-color && docker compose -f compose.yaml -f compose.demo.yaml down -v
  enterprise-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/smoke-enterprise.py --start
      - if: always()
        run: docker compose -f compose.yaml -f compose.enterprise.yaml logs --no-color && docker compose -f compose.yaml -f compose.enterprise.yaml down
