name: Security

on:
  pull_request:
  schedule: [{ cron: "18 3 * * 1" }]

jobs:
  dependency-and-image-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.33.1
        with: { scan-type: fs, format: sarif, output: trivy-fs.sarif, severity: HIGH,CRITICAL, exit-code: "1" }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif }
      - run: docker build -t deepresearch-backend:ci .
      - uses: aquasecurity/trivy-action@0.33.1
        with: { image-ref: deepresearch-backend:ci, severity: HIGH,CRITICAL, exit-code: "1" }
