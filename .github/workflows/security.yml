name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule: [{ cron: "18 3 * * 1" }]

jobs:
  dependency-and-image-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B dependency:resolve
        working-directory: business-backend
      # Full raw preserves all severities; independent exact2 compiled facts keep the original HIGH,CRITICAL source threshold.
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6, same installer as trivy-action v0.36.0
        with: { version: v0.75.0, cache: true }
      - name: Produce fresh complete source scan and independent completion proof
        id: source_scan
        run: >-
          python scripts/run_fs_source_scan.py
          --scanner "$(command -v trivy)"
          --output-dir .cache/eval/source-fs
          --source-sha "$EXPECTED_SOURCE_SHA"
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
      - name: Apply only pinned independent source2 technical facts; keep baseline HIGH,CRITICAL gate
        run: >-
          python scripts/check_fs_source_applicability.py
          --scan .cache/eval/source-fs/raw.json
          --scan-receipt .cache/eval/source-fs/completion.json
          --output .cache/eval/source-fs-verdict.json
      - name: Convert original complete source scan even when its gate fails
        if: always() && hashFiles('.cache/eval/source-fs/raw.json') != ''
        run: trivy convert --format sarif --output trivy-fs.sarif .cache/eval/source-fs/raw.json
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with: { sarif_file: trivy-fs.sarif }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: filesystem-security-${{ github.sha }}
          path: |
            .cache/eval/source-fs/raw.json
            .cache/eval/source-fs/completion.json
            .cache/eval/source-fs/scanner-version.log
            .cache/eval/source-fs/stdout.private.log
            .cache/eval/source-fs/stderr.private.log
            .cache/eval/source-fs-verdict.json
            trivy-fs.sarif
          if-no-files-found: error
  inventory-runtime:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      custom_matrix: ${{ steps.images.outputs.custom_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        run: python scripts/runtime_ci_inventory.py
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-image-inventory-${{ github.sha }}
          path: .cache/eval/runtime-image-inventory.json
  runtime-image-scan:
    needs: inventory-runtime
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory-runtime.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Verify immutable ancestor artifact source reuse
        if: matrix.approved_artifact == true
        run: python scripts/check_artifact_source_reuse.py --output .cache/eval/artifact-source-reuse.json
      - name: Load each independently approved OCI artifact without rebuilding
        if: matrix.approved_artifact == true
        run: python scripts/fetch_approved_image.py --artifact "$ARTIFACT" --tag "$SCAN_TAG" --output ".cache/eval/approved-$ARTIFACT-load.json"
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SCAN_TAG: deepresearch-scan-${{ matrix.artifact }}:ci
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan ordinary runtime image with unchanged HIGH gate
        if: matrix.approved_artifact != true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.75.0
          timeout: 5m
          format: json
          output: runtime-image.json
      - name: Keep complete raw approved-image scan for exact disposition
        id: approved_scan
        if: matrix.approved_artifact == true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deepresearch-scan-${{ matrix.artifact }}:ci
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln,secret
          list-all-pkgs: 'true'
          exit-code: '0'
          version: v0.75.0
          timeout: 5m
          format: json
          output: runtime-image.json
      - name: Reject every secret finding independently of vulnerability dispositions
        if: matrix.approved_artifact == true && steps.approved_scan.outcome == 'success'
        run: >-
          python scripts/check_image_secrets.py
          --scan runtime-image.json --scanner-exit-code 0
          --output .cache/eval/approved-image-secret-gate.json
      - name: Enforce original FIXED and independently reviewed exact OpenPGP and HTML facts
        if: matrix.artifact == 'minio' && steps.approved_scan.outcome == 'success'
        run: >-
          python scripts/check_minio_html_exact4.py
          --archive .cache/eval/approved-minio.oci.tar
          --scan runtime-image.json
          --inspect .cache/eval/approved-minio-load-inspect.json
          --scanner-exit-code 0
          --original-output .cache/eval/minio-original-disposition.json
          --exact2-output .cache/eval/minio-openpgp2-disposition.json
          --output .cache/eval/minio-ci-disposition.json
      - name: Collect complete native and full Grafana reports
        if: matrix.artifact == 'grafana' && steps.approved_scan.outcome == 'success'
        run: python scripts/scan_grafana_image.py --image deepresearch-scan-grafana:ci --output-dir .cache/eval/grafana-native
      - name: Enforce exact independently authorized Grafana per-finding dispositions
        if: matrix.artifact == 'grafana' && steps.approved_scan.outcome == 'success'
        run: >-
          python scripts/grafana_image_disposition.py
          --archive .cache/eval/approved-grafana.oci.tar
          --scan runtime-image.json
          --grype-scan .cache/eval/grafana-native/full-grype.json
          --sbom .cache/eval/grafana-native/full-syft.json
          --inspect .cache/eval/approved-grafana-load-inspect.json
          --scanner-exit-code 0 --grype-exit-code 0
          --output .cache/eval/grafana-ci-disposition.json
      - name: Verify actual native JVM bytes and native/full advisory coverage
        if: matrix.native_jvm_profile != ''
        run: python scripts/check_native_jvm.py --image "$SCAN_IMAGE" --profile "$JVM_PROFILE" --output-dir .cache/eval/native-jvm
        env:
          SCAN_IMAGE: ${{ matrix.image }}
          JVM_PROFILE: ${{ matrix.native_jvm_profile }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-security-${{ matrix.name }}-${{ github.sha }}
          path: |
            runtime-image.json
            .cache/eval/approved-*-load*.json
            .cache/eval/minio-ci-disposition.json
            .cache/eval/minio-original-disposition.json
            .cache/eval/minio-openpgp2-disposition.json
            .cache/eval/grafana-ci-disposition.json
            .cache/eval/approved-image-secret-gate.json
            .cache/eval/artifact-source-reuse.json
            .cache/eval/grafana-native/*.json
            .cache/eval/native-jvm/*.json
  application-image-scan:
    needs: inventory-runtime
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory-runtime.outputs.custom_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/build_ci_image.py
        env:
          SCAN_BUILD_CONTEXT: ${{ matrix.context }}
          SCAN_DOCKERFILE: ${{ matrix.dockerfile }}
          SCAN_BUILD_NAME: ${{ matrix.name }}
      - uses: actions/setup-go@v6
        if: matrix.name == 'tempo'
        with: { go-version: '1.27.3', cache: false }
      - name: Preserve actual Tempo ELF, native identity and runtime version for independent review
        if: matrix.name == 'tempo'
        run: >-
          python scripts/collect_tempo_evidence.py --image deepresearch-scan-tempo:ci
          --output-dir .cache/eval/tempo-native
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deepresearch-scan-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.75.0
          format: json
          output: application-image.json
      - name: Verify actual native JVM bytes and native/full advisory coverage
        if: matrix.native_jvm_profile != ''
        run: python scripts/check_native_jvm.py --image "$SCAN_IMAGE" --profile "$JVM_PROFILE" --output-dir .cache/eval/native-jvm
        env:
          SCAN_IMAGE: deepresearch-scan-${{ matrix.name }}:ci
          JVM_PROFILE: ${{ matrix.native_jvm_profile }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: application-security-${{ matrix.name }}-${{ github.sha }}
          path: |
            application-image.json
            .cache/eval/native-jvm/*.json
            .cache/eval/tempo-native/
  source-analysis:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: "python,javascript-typescript,java-kotlin", build-mode: none }
      - uses: github/codeql-action/analyze@v4
        with: { output: .cache/codeql }
      - run: python scripts/check_codeql_results.py .cache/codeql
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: source-security-${{ github.sha }}
          path: .cache/codeql/*.sarif
  source-analysis-bootstrap:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/storage-bootstrap/go.mod
          cache-dependency-path: scripts/storage-bootstrap/go.sum
      - uses: github/codeql-action/init@v4
        with: { languages: go, build-mode: manual }
      - run: go build -mod=readonly ./...
        working-directory: scripts/storage-bootstrap
      - uses: github/codeql-action/analyze@v4
        with: { output: .cache/codeql-bootstrap }
      - run: python scripts/check_codeql_results.py .cache/codeql-bootstrap
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bootstrap-source-security-${{ github.sha }}
          path: .cache/codeql-bootstrap/*.sarif
  grafana-maintenance-candidate-materials:
    # Review material only. The approved runtime, all existing security gates and
    # the human authorization are unchanged until a new exact subject is approved.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.3', cache: false }
      - name: Reuse only byte-identical ancestor candidate compile inputs
        id: candidate_reuse
        run: python scripts/reuse_grafana_candidate.py --output-dir .cache/eval/grafana-candidate-existing
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build a complete separate OCI candidate without inherited approval
        if: steps.candidate_reuse.outputs.reused != 'true'
        run: |
          mkdir -p .cache/eval
          docker buildx create --name dr-grafana-maintenance --driver docker-container --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file deployment/docker/Dockerfile.grafana-security \
            --tag deepresearch-grafana-candidate:ci \
            --metadata-file .cache/eval/grafana-candidate-build.json \
            --output type=oci,dest=.cache/eval/grafana-candidate.oci.tar .
      - name: Load the complete candidate for fresh inspection
        run: docker load --input .cache/eval/grafana-candidate.oci.tar
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with: { version: v0.75.0, cache: true }
      - name: Keep complete current vulnerability and secret findings for independent review
        run: >-
          trivy image --scanners vuln,secret --list-all-pkgs
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --timeout 10m
          --format json --output .cache/eval/grafana-candidate-raw.json
          deepresearch-grafana-candidate:ci
      - name: Reject every secret finding before collecting review materials
        id: candidate_secrets
        run: >-
          python scripts/check_image_secrets.py
          --scan .cache/eval/grafana-candidate-raw.json --scanner-exit-code 0
          --output .cache/eval/grafana-candidate-secret-gate.json
      - name: Collect full native inventories and actual ELF identities without granting a disposition
        run: >-
          python scripts/collect_grafana_candidate.py
          --image deepresearch-grafana-candidate:ci
          --archive .cache/eval/grafana-candidate.oci.tar
          --scan .cache/eval/grafana-candidate-raw.json
          --output-dir .cache/eval/grafana-candidate-reports
      - name: Split the unapproved OCI into independently checked bounded transport parts
        if: always() && steps.candidate_secrets.outcome == 'success'
        run: >-
          python scripts/split_candidate_oci.py --archive .cache/eval/grafana-candidate.oci.tar
          --output-dir .cache/eval/grafana-candidate-parts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: grafana-maintenance-candidate-${{ github.sha }}
          path: |
            .cache/eval/grafana-candidate-build.json
            .cache/eval/grafana-candidate-raw.json
            .cache/eval/grafana-candidate-secret-gate.json
            .cache/eval/grafana-candidate-reports/
            .cache/eval/grafana-candidate-existing/reuse.json
            .cache/eval/grafana-candidate-parts/parts-manifest.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-000/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-000', path: '.cache/eval/grafana-candidate-parts/group-000/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-001/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-001', path: '.cache/eval/grafana-candidate-parts/group-001/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-002/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-002', path: '.cache/eval/grafana-candidate-parts/group-002/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-003/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-003', path: '.cache/eval/grafana-candidate-parts/group-003/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-004/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-004', path: '.cache/eval/grafana-candidate-parts/group-004/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-005/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-005', path: '.cache/eval/grafana-candidate-parts/group-005/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-006/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-006', path: '.cache/eval/grafana-candidate-parts/group-006/', retention-days: 7, compression-level: 0 }
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.cache/eval/grafana-candidate-parts/group-007/*') != ''
        with: { name: 'grafana-candidate-oci-${{ github.sha }}-group-007', path: '.cache/eval/grafana-candidate-parts/group-007/', retention-days: 7, compression-level: 0 }
  grafana-official-backend-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: { backend: [tempo, prometheus, zipkin] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.3', cache: false }
      - name: Collect exact official source graphs and compare every native dependency
        run: >-
          python deployment/vendors/grafana-security/capture_official_profiles.py
          --only "${{ matrix.backend }}" --output .cache/eval/grafana-official-profiles
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: grafana-official-profile-${{ matrix.backend }}-${{ github.sha }}
          path: .cache/eval/grafana-official-profiles/
          retention-days: 7
          if-no-files-found: error
