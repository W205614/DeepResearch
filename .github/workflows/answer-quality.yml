name: Answer Quality Gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

jobs:
  answer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: deepresearch-ci-provider-cumulative-20261026
      cancel-in-progress: false
    permissions: { contents: read, actions: read }
    env:
      LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID || 'deepseek-v4-flash' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Match the measured local acceptance configuration explicitly.
      LLM_EXTRA_BODY: '{"thinking":{"type":"disabled"}}'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2, persist-credentials: false }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --frozen
      - id: quality-mode
        run: uv run python scripts/reuse_quality_evidence.py --probe
      - name: Build patched interpreter with the production Dockerfile for this checkout
        if: steps.quality-mode.outputs.mode == 'fresh'
        run: |
          mkdir -p .cache/eval
          docker buildx build --load --file Dockerfile --tag "ci-evaluation:${GITHUB_SHA}" --metadata-file .cache/eval/ci-python-build.json .
      - name: Verify actual Python and CA rejection with no network before spending
        if: steps.quality-mode.outputs.mode == 'fresh'
        run: uv run python scripts/run_ci_evaluation.py preflight --image "ci-evaluation:${GITHUB_SHA}"
      - run: uv run python scripts/reuse_quality_evidence.py
        if: steps.quality-mode.outputs.mode == 'reuse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ''
      - name: Reconcile cumulative provider ledger across all run attempts
        id: cumulative-ledger
        run: uv run python scripts/reconcile_ci_budget.py reconcile
        if: steps.quality-mode.outputs.mode == 'fresh'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check necessary fresh-evaluation budget without HTTP
        run: uv run python scripts/check_ci_evaluation_budget.py --policy eval/ci-provider-budget.json --ledger .cache/eval/provider-budget.sqlite3 --output .cache/eval/ci-budget-precheck.json
        if: steps.quality-mode.outputs.mode == 'fresh'
      - name: Require exact-source CI and Security before any model spending
        run: uv run python scripts/reconcile_ci_budget.py gate --prerequisite-wait-seconds 900
        if: steps.quality-mode.outputs.mode == 'fresh'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist paid attempt identity before provider calls
        run: uv run python scripts/reconcile_ci_budget.py start
        if: steps.quality-mode.outputs.mode == 'fresh'
      - uses: actions/upload-artifact@v6
        if: steps.quality-mode.outputs.mode == 'fresh'
        with:
          name: ci-provider-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/eval/ci-paid-start.json
          if-no-files-found: error
          retention-days: 90
      - run: uv run python scripts/run_ci_evaluation.py paid --label answers scripts/evaluate_answers.py --output .cache/eval/answer-quality.json
        name: Paid answers
        if: steps.quality-mode.outputs.mode == 'fresh'
      - run: uv run python scripts/run_ci_evaluation.py paid --label research scripts/evaluate_research.py --debug-fixed-failures --output .cache/eval/research-quality.json
        name: Paid research
        if: steps.quality-mode.outputs.mode == 'fresh'
      - run: uv run python scripts/run_ci_evaluation.py paid --label stability scripts/evaluate_research.py --only conflict-1,compare-3,single-5 --repetitions 3 --require-all --debug-fixed-failures --output .cache/eval/research-stability.json
        name: Paid stability
        if: steps.quality-mode.outputs.mode == 'fresh'
      - run: uv run python scripts/run_ci_evaluation.py paid --label extensions scripts/evaluate_research.py --cases eval/research_quality_extensions.json --output .cache/eval/research-quality-extensions.json
        name: Paid extensions
        if: steps.quality-mode.outputs.mode == 'fresh'
      - name: Seal original cumulative ledger on success or failure
        run: uv run python scripts/reconcile_ci_budget.py seal
        if: always() && steps.quality-mode.outputs.mode == 'fresh' && steps.cumulative-ledger.outcome == 'success'
      - uses: actions/upload-artifact@v6
        if: always() && steps.quality-mode.outputs.mode == 'fresh' && steps.cumulative-ledger.outcome == 'success'
        with:
          name: ci-provider-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/eval/provider-budget.sqlite3
            .cache/eval/provider-budget.json
            .cache/eval/ci-ledger-receipt.json
          if-no-files-found: error
          retention-days: 90
      - run: uv run python scripts/write_delivery_receipt.py
        if: always()
        env:
          EVALUATION_JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer-quality-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/eval/*.json
            .cache/eval/reused-source/*.json
