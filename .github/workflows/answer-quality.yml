name: Answer Quality Gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

jobs:
  answer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID || 'deepseek-v4-flash' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Match the measured local acceptance configuration explicitly.
      LLM_EXTRA_BODY: '{"thinking":{"type":"disabled"}}'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/bounded_evaluation.py --policy eval/ci-provider-budget.json --ledger .cache/eval/provider-budget.sqlite3 --label answers scripts/evaluate_answers.py --output .cache/eval/answer-quality.json
      - run: uv run python scripts/bounded_evaluation.py --policy eval/ci-provider-budget.json --ledger .cache/eval/provider-budget.sqlite3 --label research scripts/evaluate_research.py --debug-fixed-failures --output .cache/eval/research-quality.json
      - run: uv run python scripts/bounded_evaluation.py --policy eval/ci-provider-budget.json --ledger .cache/eval/provider-budget.sqlite3 --label stability scripts/evaluate_research.py --only conflict-1,compare-3,single-5 --repetitions 3 --require-all --debug-fixed-failures --output .cache/eval/research-stability.json
      - run: uv run python scripts/bounded_evaluation.py --policy eval/ci-provider-budget.json --ledger .cache/eval/provider-budget.sqlite3 --label extensions scripts/evaluate_research.py --cases eval/research_quality_extensions.json --output .cache/eval/research-quality-extensions.json
      - run: uv run python scripts/write_delivery_receipt.py
        if: always()
        env:
          EVALUATION_JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: answer-quality-evidence-${{ github.sha }}
          path: .cache/eval/*.json
