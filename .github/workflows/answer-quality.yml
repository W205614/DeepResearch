name: Answer Quality Gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

jobs:
  answer-quality:
    runs-on: ubuntu-latest
    env:
      LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID || 'deepseek-v4-flash' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/evaluate_answers.py --output .cache/eval/answer-quality.json
