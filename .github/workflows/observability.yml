name: Observability rules

on:
  pull_request:
    paths: ["observability/**", "scripts/check_observability.py", "scripts/cloud_backup_metrics.py", "tests/test_cloud_backup_metrics.py", ".github/workflows/observability.yml"]
  push:
    branches: [main]
    paths: ["observability/**", "scripts/check_observability.py", "scripts/cloud_backup_metrics.py", "tests/test_cloud_backup_metrics.py", ".github/workflows/observability.yml"]
  workflow_dispatch:

permissions: {contents: read}
jobs:
  promql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This disposable validator never starts the application or touches its data.
      - run: python scripts/check_observability.py --image prom/prometheus:v3.15.1@sha256:d445d1806b38f85b5c394a1b87f94113fde0473b45245922c2e8b1bd41fa68ae
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -q tests/test_cloud_backup_metrics.py
