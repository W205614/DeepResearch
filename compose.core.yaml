# Explicit opt-out from the optional full observability stack. Use base Compose
# alone for complete observability. Core security and resource limits remain.
services:
  agent:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
    depends_on:
      otel-collector: {condition: service_started, required: false}
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
    depends_on:
      otel-collector: {condition: service_started, required: false}
  document-worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
    depends_on:
      otel-collector: {condition: service_started, required: false}
  otel-collector:
    profiles: [observability]
  tempo:
    profiles: [observability]
  loki:
    profiles: [observability]
  prometheus:
    profiles: [observability]
  grafana:
    profiles: [observability]
  alert-relay:
    profiles: [observability]
  alertmanager:
    profiles: [observability]
  ops-exporter:
    profiles: [observability]
